name: CI - Build All Modules

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  # -------------------------
  # Frontend (Angular)
  # -------------------------
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'                          # ✅ Built-in npm cache
          cache-dependency-path: frontend-microservice/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend-microservice
        run: npm ci                             # ✅ Faster & more reliable than npm install

      - name: Build Angular
        working-directory: ./frontend-microservice
        run: npm run build

  # -------------------------
  # Backend (Spring Boot)
  # -------------------------
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'                        # ✅ Built-in Maven cache

      - name: Build Spring Boot
        working-directory: ./backend-microservice
        run: ./mvnw clean package -DskipTests

  # -------------------------
  # FastAPI (Python)
  # -------------------------
  build-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'                          # ✅ Built-in pip cache
          cache-dependency-path: model_microservice/requirements.txt

      - name: Install & check FastAPI
        working-directory: ./model_microservice
        run: |
          pip install -r requirements.txt
          python -m compileall .